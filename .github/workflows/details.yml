name: Refresh game details

# Every Sunday at 02:47 UTC (all games, about 1.5-2.5 hours), after "Refresh game IDs",
# and by hand when needed. Public repository, so these minutes are free.
on:
  schedule:
    - cron: "47 2 * * 0"
  workflow_dispatch:
    inputs:
      buckets:
        description: "Only refresh the first N of the 1,000 bucket files (0 = all, about 135,000 games)"
        required: false
        default: "10"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  details:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Fetch game details from Wikidata
        env:
          BUCKETS: ${{ inputs.buckets || '0' }}
        run: python scripts/fetch_wikidata_details.py --buckets "$BUCKETS"
      - name: Save changed files
        # Also after a failed fetch: every bucket file written so far is complete on its own.
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/wikidata-details
          if git diff --cached --quiet; then
            echo "No changes." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Refresh game details from Wikidata"
            git pull --rebase
            git push
          fi

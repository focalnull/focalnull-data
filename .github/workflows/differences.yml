name: Differences report

# Every Sunday at 10:17 UTC, after game IDs (01:17), game details (02:47), page views (06:17) and
# Commons (08:17), and by hand when needed. Reads only files already in this repository (no network)
# and rewrites reports/differences.csv. Takes well under a minute. Public repository, so these
# minutes are free. 10:17 leaves room for a late details run (up to 5 hours) and the steps after it,
# so this run never replaces a pending one in the shared "refresh" group.
on:
  schedule:
    - cron: "17 10 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  differences:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build the differences report
        run: python scripts/report_differences.py
      - name: Save changed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "No changes." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Refresh differences report"
            git pull --rebase
            git push
          fi

name: Refresh Wikipedia page views

# Every Sunday at 06:17 UTC (all games), after game IDs and game details, and by hand when needed.
on:
  schedule:
    - cron: "17 6 * * 0"
  workflow_dispatch:
    inputs:
      limit:
        description: "Only look up the first N articles (0 = all, about 28,000, roughly 1–1.5 hours)"
        required: false
        default: "500"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  pageviews:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Count article views
        env:
          LIMIT: ${{ inputs.limit || '0' }}
        run: python scripts/fetch_pageviews.py --limit "$LIMIT"
      - name: Save changed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/wikipedia-pageviews/pageviews.json
          if git diff --cached --quiet; then
            echo "No changes." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Refresh Wikipedia page views"
            git pull --rebase
            git push
          fi

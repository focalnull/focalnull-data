name: Refresh ProtonDB summary

# Manual runs only for now; ProtonDB publishes a new export about once a month.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  protondb:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Summarise the newest ProtonDB export
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_protondb.py
      - name: Save changed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/protondb/summary.json
          if git diff --cached --quiet; then
            echo "No changes." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Refresh ProtonDB summary"
            git pull --rebase
            git push
          fi

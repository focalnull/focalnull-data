name: Refresh game IDs

# Manual runs only for now. A schedule is added once the first runs look right.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Only fetch the first N games (0 = all)"
        required: false
        default: "500"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Fetch IDs from Wikidata
        env:
          LIMIT: ${{ inputs.limit }}
        run: python scripts/fetch_wikidata_ids.py --limit "$LIMIT"
      - name: Save changed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matched
          if git diff --cached --quiet; then
            echo "No changes." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Refresh game IDs from Wikidata"
            git pull --rebase
            git push
          fi
